<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Sen Party Rentals</title>
<link rel="stylesheet" href="assets/style.css">
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  color: #0f172a;
  font-family: var(--font-family);
  background: linear-gradient(135deg, #ff6b6b 0%, #ffb86b 25%, #7ee8fa 50%, #a78bfa 75%, #8be04f 100%);
  background-size: 400% 400%;
  animation: gradientFlow 20s ease infinite;
}
.thank-you-box {
  background: rgba(255,255,255,0.95);
  padding: 2rem 3rem;
  border-radius: 16px;
  box-shadow: var(--shadow);
  max-width: 600px;
  animation: popIn 0.6s ease forwards;
}
.thank-you-box h1 {
  font-size: 2.2rem;
  background: linear-gradient(90deg, var(--c4), var(--c3), var(--c1));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 1rem;
}
.thank-you-box p {
  font-size: 1.1rem;
  margin-bottom: 1.5rem;
  color: var(--muted);
}
.btn-home {
  display: inline-block;
  padding: 0.7rem 1.4rem;
  background: linear-gradient(90deg, var(--c4), var(--c1));
  color: #fff;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 700;
  box-shadow: var(--shadow);
  transition: 0.2s;
}
.btn-home:hover { opacity: 0.9; }

/* Animations */
@keyframes popIn {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Confetti overlay */
body::after {
  content: "";
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: url('assets/confetti.png') repeat;
  opacity: 0.08;
  pointer-events: none;
  z-index: -1;
}
</style>
</head>
<body>

<div class="thank-you-box">
  <h1>🎉 Thank You!</h1>
  <p>Your booking has been submitted successfully. We will contact you shortly to confirm availability and details.</p>
  <a href="index.html" class="btn-home">Return to Home</a>
</div>

</body>
</html>
