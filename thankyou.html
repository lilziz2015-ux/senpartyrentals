<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Sen Party Rentals</title>
<link rel="stylesheet" href="assets/style.css">
<style>
/* BODY & BACKGROUND */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  background: linear-gradient(135deg, #7dd3fc, #fcd34d, #f87171, #a78bfa);
  background-size: 400% 400%;
  animation: gradientFlow 20s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
}

@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* THANK-YOU CARD */
.thank-you-card {
  position: relative;
  background: rgba(255,255,255,0.97);
  padding: 3rem 2.5rem;
  border-radius: 25px;
  max-width: 650px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  z-index: 10;
  animation: popIn 0.6s ease forwards;
}

@keyframes popIn {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.thank-you-card h1 {
  font-size: 2.8rem;
  margin-bottom: 1rem;
  background: linear-gradient(90deg, #7e22ce, #ec4899, #f59e0b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.thank-you-card p {
  font-size: 1.25rem;
  margin-bottom: 2rem;
  color: #475569;
}

.btn-home {
  display: inline-block;
  padding: 0.8rem 2.2rem;
  background: linear-gradient(90deg, #7e22ce, #6366f1);
  color: #fff;
  font-weight: 600;
  border-radius: 15px;
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 10px 25px rgba(124,58,237,0.25);
}

.btn-home:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(124,58,237,0.35);
}

/* CANVAS */
canvas#animation-bg {
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  z-index: 1;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="thank-you-card">
  <h1>🎉 Thank You!</h1>
  <p>Your booking has been received successfully. We'll contact you shortly to confirm availability. Get ready for an amazing party! 🎈</p>
  <a href="index.html" class="btn-home">Return to Home</a>
</div>

<canvas id="animation-bg"></canvas>

<script>
const canvas = document.getElementById('animation-bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ---- BOUNCY HOUSES ----
class BounceHouse {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + Math.random() * 300;
    this.size = 50 + Math.random() * 40;
    this.speed = 0.3 + Math.random()*0.5;
    this.color = `hsl(${Math.random()*360},60%,55%)`;
    this.kidOffset = Math.random() * 20;
  }
  update() { this.y -= this.speed; if(this.y + this.size < 0) this.reset(); }
  draw() {
    // house
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.size, this.size);
    // door
    ctx.fillStyle = '#fff';
    ctx.fillRect(this.x + this.size*0.2, this.y + this.size*0.4, this.size*0.6, this.size*0.5);
    // kid bouncing
    ctx.beginPath();
    ctx.arc(this.x + this.size*0.5, this.y - this.kidOffset, 7, 0, Math.PI*2);
    ctx.fillStyle = '#ff4081';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(this.x + this.size*0.5, this.y - this.kidOffset + 7);
    ctx.lineTo(this.x + this.size*0.5, this.y - this.kidOffset + 20);
    ctx.strokeStyle = '#ff4081';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// ---- SLIDES ----
class Slide {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + Math.random() * 300;
    this.width = 80 + Math.random() * 40;
    this.height = 15 + Math.random()*5;
    this.speed = 0.5 + Math.random();
    this.color = `hsl(${Math.random()*360},70%,60%)`;
  }
  update() { this.y -= this.speed; if(this.y + this.height < 0) this.reset(); }
  draw() { ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.width, this.height); }
}

// ---- KIDS ON SLIDES ----
class KidSlide {
  constructor(slide) {
    this.slide = slide;
    this.reset();
  }
  reset() {
    this.x = this.slide.x + 5 + Math.random()*20;
    this.y = this.slide.y - 10;
    this.size = 6 + Math.random()*4;
    this.speedX = 1 + Math.random();
    this.speedY = 0.3 + Math.random()*0.5;
    this.color = '#ff5722';
  }
  update() { this.x += this.speedX; this.y += this.speedY; if(this.x > this.slide.x + this.slide.width) this.reset(); }
  draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fillStyle = this.color; ctx.fill(); }
}

// ---- BALLOONS ----
class Balloon {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + Math.random() * 200;
    this.size = 20 + Math.random() * 15;
    this.speedY = 0.5 + Math.random() * 0.5;
    this.color = `hsl(${Math.random()*360},80%,65%)`;
  }
  update() { this.y -= this.speedY; if(this.y + this.size < 0) this.reset(); }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.size*0.7, this.size, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y + this.size);
    ctx.lineTo(this.x, this.y + this.size + 20);
    ctx.stroke();
  }
}

const houses = Array.from({length:12}, ()=>new BounceHouse());
const slides = Array.from({length:15}, ()=>new Slide());
const kidsOnSlides = slides.map(slide=>new KidSlide(slide));
const balloons = Array.from({length:25}, ()=>new Balloon());

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  houses.forEach(h=>{h.update(); h.draw();});
  slides.forEach(s=>{s.update(); s.draw();});
  kidsOnSlides.forEach(k=>{k.update(); k.draw();});
  balloons.forEach(b=>{b.update(); b.draw();});
  requestAnimationFrame(animate);
}
animate();

// Responsive
window.addEventListener('resize', ()=>{ canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
</script>

</body>
</html>
